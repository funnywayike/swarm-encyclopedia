name: Wrong or missing citation
description: A reference on a page is wrong (authors, year, venue, pages) or does not support the claim.
labels: [citation]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: URL of the page, or its path (for example `algo/f2-si/pso/`).
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: Quote the reference or the claim, and say what the correct one is. A DOI or link helps.
    validations:
      required: true
